<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d">
  <title id="t">Flowshot overview</title>
  <desc id="d">A HAR export from the browser goes into Flowshot. Flowshot keeps the API calls, removes cookies and tokens, and writes evidence files and a typed component.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#172036"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="24" fill="url(#bg)"/>
  <text x="48" y="64" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Flowshot</text>
  <text x="48" y="94" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">One recorded action in, a component and the evidence behind it out.</text>

  <!-- 1. input -->
  <g>
    <rect x="48" y="140" width="210" height="200" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="72" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7dd3fc" font-weight="700">1 · RECORD</text>
    <text x="72" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">HAR export</text>
    <text x="72" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">DevTools → Network</text>
    <text x="72" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Save all as HAR</text>
    <text x="72" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">GET /api/notes?q=design</text>
  </g>

  <path d="M264 240 H308" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2. processing -->
  <g>
    <rect x="312" y="140" width="250" height="200" rx="18" fill="url(#card)" stroke="url(#accent)" stroke-width="2"/>
    <text x="336" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7dd3fc" font-weight="700">2 · PROCESS</text>
    <text x="336" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Flowshot CLI</text>
    <text x="336" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1">✓ keep API calls (XHR, fetch, JSON)</text>
    <text x="336" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1">✓ drop cookies and tokens</text>
    <text x="336" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1">✓ skip scripts, styles, images</text>
    <text x="336" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">--framework react | angular | svelte | astro</text>
  </g>

  <path d="M566 240 H610" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3. outputs -->
  <g>
    <rect x="614" y="140" width="298" height="200" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="638" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7dd3fc" font-weight="700">3 · OUTPUT</text>
    <rect x="638" y="196" width="250" height="34" rx="9" fill="#0f172a" stroke="#334155"/>
    <text x="654" y="219" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">evidence.md · flow.json</text>
    <rect x="638" y="240" width="250" height="34" rx="9" fill="#0f172a" stroke="#334155"/>
    <text x="654" y="263" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">api.ts (one fetch per call)</text>
    <rect x="638" y="284" width="250" height="34" rx="9" fill="#0f172a" stroke="#334155"/>
    <text x="654" y="307" font-family="Consolas, monospace" font-size="14" fill="#e2e8f0">NotesSearch.tsx / .svelte</text>
  </g>

  <text x="48" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Redaction is best-effort: review evidence.md before you share it. Secrets are never copied into the output.</text>
</svg>
